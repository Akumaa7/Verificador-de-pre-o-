<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificador de Preços</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#ffd21f"><link rel="icon" href="icon.svg">
<style>
:root{--ink:#14213d;--bg:#f4f6fa;--card:#fff;--line:#d5dbe6;--bad:#c4202f;--ok:#17744d;--warn:#8a5a00;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--ink:#eef1f8;--bg:#10151f;--card:#1a2230;--line:#2c374a;--bad:#ff7b86;--ok:#5fd39c;--warn:#ffcf66}}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#ffd21f;color:#14213d;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}header h1{margin:0;font-size:18px}#status{font-size:13px;min-height:18px}
nav{display:flex;gap:6px;padding:10px 12px 0}nav button{flex:1;padding:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;font-weight:600}nav button[aria-pressed=true]{border-color:#ffd21f;background:#ffd21f;color:#14213d}
main{padding:12px;max-width:640px;margin:auto}section[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.preco{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
label{display:block;font-size:13px;margin-top:8px}input,textarea,select{width:100%;padding:10px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button.p{margin-top:12px;width:100%;padding:12px;border:2px solid var(--ink);border-radius:8px;background:#14213d;color:#fff;font:inherit;font-weight:700}button.s{padding:8px 10px;margin:4px 4px 0 0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.warn{color:var(--warn);font-weight:600}.bad{color:var(--bad);font-weight:700}.ok{color:var(--ok);font-weight:700}.mut{font-size:13px;opacity:.75}img.th{max-width:100%;border-radius:8px}
:focus-visible{outline:3px solid #ffd21f;outline-offset:2px}
</style></head><body>
<header><h1>Verificador de Preços</h1><div id="status"></div></header>
<nav><button data-t="etq" aria-pressed="true">Etiqueta</button><button data-t="cup" aria-pressed="false">Cupom</button><button data-t="his" aria-pressed="false">Histórico</button></nav>
<main>
<section id="etq"><label>Fotografar etiqueta<input id="foto" type="file" accept="image/*" capture="environment"></label><div id="resultado"></div></section>
<section id="cup" hidden><label>Fotografar cupom (pode escolher várias partes, de cima para baixo)<input id="fcup" type="file" accept="image/*" capture="environment" multiple></label><label style="display:flex;gap:8px;align-items:center"><input id="cond" type="checkbox" style="width:auto"> Cumpro as condições das promoções (clube, cadastro)</label><div id="cupres"></div></section>
<section id="his" hidden><input id="busca" type="search" placeholder="Buscar produto"><div id="lista"></div></section>
</main><script type="module" src="src/app.js"></script></body></html>
